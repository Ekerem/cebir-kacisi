name: APK
on:
  push:
    branches: [main]
    paths: ['web/**', 'capacitor.config.json', 'package.json', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk cebir-kacisi.apk
      - id: v
        run: echo "version=$(node -p "require('./web/version.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: cebir-kacisi-apk, path: cebir-kacisi.apk }
      - name: Release oluştur ve APK'yı ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.v.outputs.version }}"
          target_commitish: ${{ github.sha }}
          name: "Cebir Kaçışı v${{ steps.v.outputs.version }}"
          files: cebir-kacisi.apk
          make_latest: true
